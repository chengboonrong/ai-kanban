name: ai_kanban
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts: # Red Hat, SIL Open Font License 1.1 (assets/fonts/OFL.txt)
    - family: RedHatText
      fonts:
        - asset: assets/fonts/RedHatText-Regular.ttf
        - asset: assets/fonts/RedHatText-Medium.ttf
          weight: 500
    - family: RedHatDisplay
      fonts:
        - asset: assets/fonts/RedHatDisplay-SemiBold.ttf
          weight: 600
    - family: RedHatMono
      fonts:
        - asset: assets/fonts/RedHatMono-Regular.ttf
        - asset: assets/fonts/RedHatMono-Medium.ttf
          weight: 500
